<!-- BnB Booking Widget multilingua - compatibile WordPress/Divi (vanilla JS).
     Lingua: <html lang> (anche en-US, fr-FR, de-DE), poi URL (?lang, ?language,
     ?locale, prefisso /it|en|fr|de/ o sottodominio), poi browser; fallback italiano.
     Una lingua della pagina non supportata usa l'italiano.
     I cambi di <html lang> aggiornano il widget senza perdere date e ospiti.
-->
<div class="bnbw" data-bnbw data-bnbw-multilang
	 data-base-url="https://www.bed-and-breakfast.it/it/strutturepm/181"
	 data-id-pm="181"
	 data-utm-source="widgetPm"
	 data-open-target="_blank">

  <div data-bnbw-i18n-aria="availability" class="bnbw__bar" role="group" aria-label="Selettore disponibilità">
	<!-- Check-in -->
	<button type="button" class="bnbw__seg bnbw__seg--date" data-bnbw-open="calendar" data-bnbw-date-part="in" aria-haspopup="dialog">
	  <div data-bnbw-i18n="checkIn" class="bnbw__label">Check-In</div>
	  <div class="bnbw__dateRow">
		<div class="bnbw__bigDay" data-bnbw-in-day>--</div>
		<div class="bnbw__dateText">
		  <div class="bnbw__monthYear" data-bnbw-in-monthyear>--</div>
		  <div class="bnbw__weekday" data-bnbw-in-weekday>--</div>
		</div>
	  </div>
	</button>

	<!-- Check-out -->
	<button type="button" class="bnbw__seg bnbw__seg--date" data-bnbw-open="calendar" data-bnbw-date-part="out" aria-haspopup="dialog">
	  <div data-bnbw-i18n="checkOut" class="bnbw__label">Check-Out</div>
	  <div class="bnbw__dateRow">
		<div class="bnbw__bigDay" data-bnbw-out-day>--</div>
		<div class="bnbw__dateText">
		  <div class="bnbw__monthYear" data-bnbw-out-monthyear>--</div>
		  <div class="bnbw__weekday" data-bnbw-out-weekday>--</div>
		</div>
	  </div>
	</button>

	<!-- Reset (icona X tra date e ospiti, come reference) -->
	<button data-bnbw-i18n-aria="resetLabel" data-bnbw-i18n-title="resetTitle" type="button" class="bnbw__reset" data-bnbw-reset aria-label="Reimposta date e ospiti" title="Reimposta">
	  <span aria-hidden="true">×</span>
	</button>

	<!-- Ospiti -->
	<button type="button" class="bnbw__seg bnbw__seg--guests" data-bnbw-open="guests" aria-haspopup="dialog">
	  <div data-bnbw-i18n="guests" class="bnbw__label">Ospiti</div>
	  <div class="bnbw__guestsRow">
		<div class="bnbw__guestsText" data-bnbw-guests-summary>--</div>
		<span class="bnbw__chev" aria-hidden="true">
		  <svg viewBox="0 0 24 24" width="18" height="18" focusable="false" aria-hidden="true">
			<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
		  </svg>
		</span>
	  </div>
	</button>

	<!-- CTA -->
	<button data-bnbw-i18n="submit" type="button" class="bnbw__cta" data-bnbw-submit>
	  Verifica disponibilità
	</button>
  </div>

  <!-- Overlay (usato soprattutto su mobile) -->
  <div class="bnbw__overlay" data-bnbw-overlay hidden></div>

  <!-- POPUP: Calendario -->
  <div data-bnbw-i18n-aria="calendar" class="bnbw__pop bnbw__pop--calendar" data-bnbw-pop="calendar" role="dialog" aria-modal="true" aria-label="Selezione date" hidden>
	<div class="bnbw__popHead">
	  <button data-bnbw-i18n-aria="previousMonth" type="button" class="bnbw__nav" data-bnbw-cal-prev aria-label="Mese precedente">‹</button>
	  <div class="bnbw__popTitle" data-bnbw-cal-title>Seleziona il <strong>check-in</strong></div>
	  <button data-bnbw-i18n-aria="nextMonth" type="button" class="bnbw__nav" data-bnbw-cal-next aria-label="Mese successivo">›</button>
	</div>

	<div class="bnbw__months" data-bnbw-months></div>

	<!-- (mobile) chiusura in basso stile reference -->
	<button data-bnbw-i18n-aria="closeCalendar" type="button" class="bnbw__bottomClose" data-bnbw-close aria-label="Chiudi calendario">×</button>
  </div>

  <!-- POPUP: Ospiti -->
  <div data-bnbw-i18n-aria="guestSelection" class="bnbw__pop bnbw__pop--guests" data-bnbw-pop="guests" role="dialog" aria-modal="true" aria-label="Selezione ospiti" hidden>
	<div class="bnbw__guestRows">
	  <div class="bnbw__row">
		<div data-bnbw-i18n="rooms" class="bnbw__rowLabel">Camere</div>
		<div class="bnbw__stepper">
		  <button data-bnbw-i18n-aria="decreaseRooms" type="button" class="bnbw__btn bnbw__btn--minus" data-bnbw-dec="rooms" aria-label="Diminuisci camere">−</button>
		  <div class="bnbw__val" data-bnbw-val="rooms">1</div>
		  <button data-bnbw-i18n-aria="increaseRooms" type="button" class="bnbw__btn bnbw__btn--plus" data-bnbw-inc="rooms" aria-label="Aumenta camere">+</button>
		</div>
	  </div>

	  <div class="bnbw__row">
		<div data-bnbw-i18n="adults" class="bnbw__rowLabel">Adulti</div>
		<div class="bnbw__stepper">
		  <button data-bnbw-i18n-aria="decreaseAdults" type="button" class="bnbw__btn bnbw__btn--minus" data-bnbw-dec="adults" aria-label="Diminuisci adulti">−</button>
		  <div class="bnbw__val" data-bnbw-val="adults">2</div>
		  <button data-bnbw-i18n-aria="increaseAdults" type="button" class="bnbw__btn bnbw__btn--plus" data-bnbw-inc="adults" aria-label="Aumenta adulti">+</button>
		</div>
	  </div>

	  <div class="bnbw__row">
		<div data-bnbw-i18n="children" class="bnbw__rowLabel">Bambini</div>
		<div class="bnbw__stepper">
		  <button data-bnbw-i18n-aria="decreaseChildren" type="button" class="bnbw__btn bnbw__btn--minus" data-bnbw-dec="children" aria-label="Diminuisci bambini">−</button>
		  <div class="bnbw__val" data-bnbw-val="children">0</div>
		  <button data-bnbw-i18n-aria="increaseChildren" type="button" class="bnbw__btn bnbw__btn--plus" data-bnbw-inc="children" aria-label="Aumenta bambini">+</button>
		</div>
	  </div>

	  <div class="bnbw__childAges" data-bnbw-child-ages hidden>
		<div data-bnbw-i18n="childAges" class="bnbw__childAgesTitle">Età dei bambini:</div>
		<div class="bnbw__childAgesGrid" data-bnbw-child-ages-grid></div>
	  </div>

	  <div class="bnbw__selectWrap">
		<select data-bnbw-i18n-aria="pets" class="bnbw__select" data-bnbw-pets aria-label="Animali">
		  <option data-bnbw-i18n="withoutPets" value="0" selected>viaggio senza animali</option>
		  <option data-bnbw-i18n="withPets" value="1">viaggio con animali</option>
		</select>
	  </div>

	  <button data-bnbw-i18n="apply" type="button" class="bnbw__apply" data-bnbw-apply>Applica</button>
	</div>
  </div>

</div>

<script>
(function(){
  'use strict';

  function pad2(n){ return (n<10?'0':'') + n; }
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n){
	var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
	x.setDate(x.getDate() + n);
	return x;
  }
  function cap(s){ return s ? (s.charAt(0).toUpperCase() + s.slice(1)) : s; }
  function formatForUrl(d){ return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear(); }
  function isSameDay(a,b){
	return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  // Testi delle quattro versioni originali, inclusi i nomi accessibili.
  var TRANSLATIONS = {
    "it": {
        "locale": "it-IT",
        "availability": "Selettore disponibilità",
        "checkIn": "Check-In",
        "checkOut": "Check-Out",
        "guests": "Ospiti",
        "resetLabel": "Reimposta date e ospiti",
        "resetTitle": "Reimposta",
        "submit": "Verifica disponibilità",
        "calendar": "Selezione date",
        "previousMonth": "Mese precedente",
        "nextMonth": "Mese successivo",

  function normalizeLanguage(value){
    var code = String(value || '').trim().toLowerCase().split(/[-_]/)[0];
    return Object.prototype.hasOwnProperty.call(TRANSLATIONS, code) ? code : null;
  }

  function detectLanguage(){
    var pageLanguage = document.documentElement.getAttribute('lang');
    if(pageLanguage && pageLanguage.trim()) return normalizeLanguage(pageLanguage) || 'it';

    var url = new URL(window.location.href);
    var candidates = [url.searchParams.get('lang'), url.searchParams.get('language'),
      url.searchParams.get('locale')];
    for(var i=0;i<candidates.length;i++){
      var language = normalizeLanguage(candidates[i]);
      if(language) return language;
    }
    var prefixes = [url.pathname.split('/')[1], url.hostname.split('.')[0]];
    for(var p=0;p<prefixes.length;p++){
      var prefix = prefixes[p].toLowerCase();
      if(Object.prototype.hasOwnProperty.call(TRANSLATIONS, prefix)) return prefix;
    }
    var preferred = navigator.languages || [navigator.language];
    for(var j=0;j<preferred.length;j++){
      var browserLanguage = normalizeLanguage(preferred[j]);
      if(browserLanguage) return browserLanguage;
    }
    return 'it';
  }

  function buildSummary(adults, children, text){
    var parts = [adults === 1 ? text.adultOne : adults + text.adultMany];
    if(children > 0) parts.push(children === 1 ? text.childOne : children + text.childMany);
    return parts.join(', ');
  }

  function initWidget(root){
    if(root.hasAttribute('data-bnbw-initialized')) return;
    root.setAttribute('data-bnbw-initialized', 'true');
    var language = null;
    var text = TRANSLATIONS.it;
	var baseUrl = root.getAttribute('data-base-url');
	var idPm = root.getAttribute('data-id-pm');
	var utmSource = root.getAttribute('data-utm-source') || 'widgetPm';
	var openTarget = root.getAttribute('data-open-target') || '_blank';

	var overlay = root.querySelector('[data-bnbw-overlay]');
	var popCalendar = root.querySelector('[data-bnbw-pop="calendar"]');
	var popGuests = root.querySelector('[data-bnbw-pop="guests"]');

	var portalHost = document.createElement('div');
	portalHost.className = 'bnbw__portalHost';
	document.body.appendChild(portalHost);
	portalHost.appendChild(overlay);
	portalHost.appendChild(popCalendar);
	portalHost.appendChild(popGuests);
	var monthsWrap = popCalendar.querySelector('[data-bnbw-months]');
	var calTitle = popCalendar.querySelector('[data-bnbw-cal-title]');

	var inDayEl = root.querySelector('[data-bnbw-in-day]');
	var inMYEl = root.querySelector('[data-bnbw-in-monthyear]');
	var inWDEl = root.querySelector('[data-bnbw-in-weekday]');
	var outDayEl = root.querySelector('[data-bnbw-out-day]');
	var outMYEl = root.querySelector('[data-bnbw-out-monthyear]');
	var outWDEl = root.querySelector('[data-bnbw-out-weekday]');
	var guestsSummaryEl = root.querySelector('[data-bnbw-guests-summary]');

	var valRoomsEl = popGuests.querySelector('[data-bnbw-val="rooms"]');
	var valAdultsEl = popGuests.querySelector('[data-bnbw-val="adults"]');
	var valChildrenEl = popGuests.querySelector('[data-bnbw-val="children"]');
	var childAgesWrapEl = popGuests.querySelector('[data-bnbw-child-ages]');
	var childAgesGridEl = popGuests.querySelector('[data-bnbw-child-ages-grid]');
	var petsEl = popGuests.querySelector('[data-bnbw-pets]');

	// Config limiti (puoi cambiare qui se vuoi)
	var LIMITS = {
	  rooms:   { min: 1, max: 9 },
	  adults:  { min: 1, max: 20 },
	  children:{ min: 0, max: 9 }
	};

	var today = startOfDay(new Date());

	// Stato
	var state = {
	  checkIn: addDays(today, 1),
	  checkOut: addDays(today, 2),
	  rooms: 1,
	  adults: 2,
	  children: 0,
	  childAges: [],
	  pets: 0,
	  open: null,           // 'calendar' | 'guests' | null
	  selecting: 'in',      // 'in' | 'out'
	  baseMonth: new Date(today.getFullYear(), today.getMonth(), 1)
	};

    function translateLabels(container){
      var bindings = [
        ['data-bnbw-i18n', null],
        ['data-bnbw-i18n-aria', 'aria-label'],
        ['data-bnbw-i18n-title', 'title']
      ];
      bindings.forEach(function(binding){
        var elements = container.querySelectorAll('[' + binding[0] + ']');
        for(var i=0;i<elements.length;i++){
          var value = text[elements[i].getAttribute(binding[0])];
          if(binding[1]) elements[i].setAttribute(binding[1], value);
          else elements[i].textContent = value;
        }
      });
    }

    function refreshLanguage(){
      var detected = detectLanguage();
      if(detected === language) return;
      language = detected;
      text = TRANSLATIONS[language];
      root.setAttribute('lang', language);
      portalHost.setAttribute('lang', language);
      translateLabels(root);
      translateLabels(portalHost);
      renderGuests();
      renderCalendar();
    }

	function setOverlay(show){
	  if(show){
		overlay.hidden = false;
	  }else{
		overlay.hidden = true;
	  }
	}

	function setBodyScrollLocked(locked){
	  document.body.classList.toggle('bnbw-no-scroll', !!locked);
	}

	function updateViewportHeightVar(){
	  var vv = window.visualViewport;
	  var vh = (vv && vv.height) ? vv.height : window.innerHeight;
	  var vw = (vv && vv.width) ? vv.width : window.innerWidth;
	  document.documentElement.style.setProperty('--bnbw-vh', vh + 'px');
	  document.documentElement.style.setProperty('--bnbw-vw', vw + 'px');
	}

	function openPop(which){
      refreshLanguage();
	  closeAll();

	  state.open = which;

	  // overlay + lock scroll per comportamento uniforme su tutti i device
	  setOverlay(true);
	  setBodyScrollLocked(true);
	  updateViewportHeightVar();

	  if(which === 'calendar'){
		popCalendar.hidden = false;
		// baseMonth: mostra sempre dal mese del check-in
		state.baseMonth = new Date(state.checkIn.getFullYear(), state.checkIn.getMonth(), 1);
		renderCalendar();
	  } else if(which === 'guests'){
		popGuests.hidden = false;
		renderGuests();
	  }
	}

	function closeAll(){
	  state.open = null;
	  popCalendar.hidden = true;
	  popGuests.hidden = true;
	  setOverlay(false);
	  setBodyScrollLocked(false);
	}

	function renderTopDates(){
	  // Check-in
	  inDayEl.textContent = pad2(state.checkIn.getDate()).replace(/^0/,'');
	  inMYEl.textContent = text.months[state.checkIn.getMonth()] + ' ' + state.checkIn.getFullYear();
	  inWDEl.textContent = cap(state.checkIn.toLocaleDateString(text.locale, { weekday:'long' }));

	  // Check-out
	  outDayEl.textContent = pad2(state.checkOut.getDate()).replace(/^0/,'');
	  outMYEl.textContent = text.months[state.checkOut.getMonth()] + ' ' + state.checkOut.getFullYear();
	  outWDEl.textContent = cap(state.checkOut.toLocaleDateString(text.locale, { weekday:'long' }));

	  guestsSummaryEl.textContent = buildSummary(state.adults, state.children, text);
	}

	function clamp(key, v){
	  var min = LIMITS[key].min, max = LIMITS[key].max;
	  if(v < min) v = min;
	  if(v > max) v = max;
	  return v;
	}

	function updateMinusButtons(){
	  var minusBtns = popGuests.querySelectorAll('[data-bnbw-dec]');
	  for(var i=0;i<minusBtns.length;i++){
		var k = minusBtns[i].getAttribute('data-bnbw-dec');
		var val = state[k];
		if(val <= LIMITS[k].min) minusBtns[i].classList.add('is-disabled');
		else minusBtns[i].classList.remove('is-disabled');
	  }
	}

	function ageOptionsHtml(selectedAge){
	  var html = '';
	  for(var age=0; age<=17; age++){
		var label = age === 0 ? '<1' : String(age);
		html += '<option value="' + age + '"' + (age === selectedAge ? ' selected' : '') + '>' + label + '</option>';
	  }
	  return html;
	}

	function syncChildAgesLength(){
	  while(state.childAges.length < state.children) state.childAges.push(0);
	  if(state.childAges.length > state.children) state.childAges.length = state.children;
	}

	function renderChildAges(){
	  syncChildAgesLength();
	  if(state.children === 0){
		childAgesWrapEl.hidden = true;
		childAgesGridEl.innerHTML = '';
		return;
	  }

	  childAgesWrapEl.hidden = false;
	  var html = '';
	  for(var i=0;i<state.children;i++){
		html += '<select class="bnbw__childAge" data-bnbw-child-age="' + i + '" aria-label="' + text.childAgePrefix + (i+1) + '">';
		html += ageOptionsHtml(state.childAges[i] || 0);
		html += '</select>';
	  }
	  childAgesGridEl.innerHTML = html;
	}

	function renderGuests(){
	  valRoomsEl.textContent = state.rooms;
	  valAdultsEl.textContent = state.adults;
	  valChildrenEl.textContent = state.children;
	  petsEl.value = String(state.pets);
	  updateMinusButtons();
	  renderChildAges();
	  renderTopDates();
	}

	function monthMeta(year, month){
	  var first = new Date(year, month, 1);
	  var daysInMonth = new Date(year, month+1, 0).getDate();
	  // Monday-first index: 0..6
	  var dow = (first.getDay() + 6) % 7;
	  return { first:first, days:daysInMonth, offset:dow };
	}

	function renderMonth(year, month){
	  var meta = monthMeta(year, month);
	  var wrap = document.createElement('div');
	  wrap.className = 'bnbw__month';

	  var name = document.createElement('div');
	  name.className = 'bnbw__monthName';
	  name.textContent = text.months[month] + ' ' + year;
	  wrap.appendChild(name);

	  var dow = document.createElement('div');
	  dow.className = 'bnbw__dow';
	  for(var i=0;i<7;i++){
		var s = document.createElement('div');
		s.textContent = text.weekdays[i];
		dow.appendChild(s);
	  }
	  wrap.appendChild(dow);

	  var grid = document.createElement('div');
	  grid.className = 'bnbw__grid';

	  // blanks
	  for(var b=0;b<meta.offset;b++){
		var blank = document.createElement('div');
		blank.className = 'bnbw__day bnbw__day--muted';
		blank.textContent = '';
		grid.appendChild(blank);
	  }

	  for(var d=1; d<=meta.days; d++){
		(function(dayNum){
		  var date = new Date(year, month, dayNum);
		  var cell = document.createElement('div');
		  cell.className = 'bnbw__day';
		  cell.textContent = String(dayNum);

		  var disabled = startOfDay(date) < today;
		  if(disabled){
			cell.className += ' bnbw__day--muted';
		  }else{
			cell.setAttribute('role','button');
			cell.setAttribute('tabindex','0');
			cell.setAttribute('aria-label', text.selectDatePrefix + formatForUrl(date));
			cell.addEventListener('click', function(){ onPickDate(date); });
			cell.addEventListener('keydown', function(e){
			  if(e.key === 'Enter' || e.key === ' '){
				e.preventDefault();
				onPickDate(date);
			  }
			});
		  }

		  // selected style
		  if(isSameDay(date, state.checkIn)){
			cell.className += ' bnbw__day--selected';
			cell.textContent = String(dayNum);
			var tag = document.createElement('div');
			tag.className = 'bnbw__tag';
			tag.textContent = text.arrivalTag;
			cell.appendChild(tag);
		  } else if(isSameDay(date, state.checkOut)){
			cell.className += ' bnbw__day--selected';
			cell.textContent = String(dayNum);
			var tag2 = document.createElement('div');
			tag2.className = 'bnbw__tag';
			tag2.textContent = text.departureTag;
			cell.appendChild(tag2);
		  }

		  grid.appendChild(cell);
		})(d);
	  }

	  wrap.appendChild(grid);
	  return wrap;
	}

	function renderCalendar(){
	  // Titolo
	  if(state.selecting === 'in'){
		calTitle.innerHTML = text.arrivalTitle;
	  } else {
		calTitle.innerHTML = text.departureTitle;
	  }

	  // Render 2 mesi: baseMonth e baseMonth+1 (desktop affiancati, mobile in colonna)
	  monthsWrap.innerHTML = '';

	  var y1 = state.baseMonth.getFullYear();
	  var m1 = state.baseMonth.getMonth();
	  var next = new Date(y1, m1+1, 1);

	  monthsWrap.appendChild(renderMonth(y1, m1));
	  monthsWrap.appendChild(renderMonth(next.getFullYear(), next.getMonth()));
	}

	function onPickDate(date){
	  var picked = startOfDay(date);

	  if(state.selecting === 'in'){
		state.checkIn = picked;
		// se check-out non valido, forza +1
		if(startOfDay(state.checkOut) <= state.checkIn){
		  state.checkOut = addDays(state.checkIn, 1);
		}
		state.selecting = 'out';
		renderCalendar();
		renderTopDates();
		return;
	  }

	  // selecting out
	  if(picked <= state.checkIn){
		// se clicchi un giorno <= check-in, lo trattiamo come nuovo check-in (UX comune)
		state.checkIn = picked;
		state.checkOut = addDays(state.checkIn, 1);
		state.selecting = 'out';
		renderCalendar();
		renderTopDates();
		return;
	  }

	  state.checkOut = picked;
	  renderTopDates();
	  closeAll();
	}

	function resetAll(){
	  state.checkIn = addDays(today, 1);
	  state.checkOut = addDays(today, 2);
	  state.rooms = 1;
	  state.adults = 2;
	  state.children = 0;
	  state.childAges = [];
	  state.pets = 0;
	  state.selecting = 'in';
	  renderTopDates();
	  renderGuests();
	  closeAll();
	}

	function buildAndOpenUrl(){
      refreshLanguage();
	  // sicurezza: check-out almeno 1 notte
	  if(startOfDay(state.checkOut) <= startOfDay(state.checkIn)){
		state.checkOut = addDays(state.checkIn, 1);
	  }

	  syncChildAgesLength();

	  var u = new URL(baseUrl);
      u.pathname = u.pathname.replace(/^\/(?:it|en|fr|de)(?=\/|$)/, '/' + language);
	  u.searchParams.set('numberRooms', String(state.rooms));
	  u.searchParams.set('numberPeople', String(state.adults));
	  u.searchParams.set('children', state.children > 0 ? state.childAges.join(',') : '');
	  u.searchParams.set('idPm', String(idPm));
	  u.searchParams.set('utm_source', String(utmSource));
	  u.searchParams.set('checkIn', formatForUrl(state.checkIn));
	  u.searchParams.set('checkOut', formatForUrl(state.checkOut));
	  if(state.children > 0){
		for(var i=0;i<state.childAges.length;i++){
		  u.searchParams.set('ageChild_' + i, String(state.childAges[i]));
		}
	  }
	  u.searchParams.set('animaliAmmessi', String(state.pets));

	  // Apri
	  window.open(u.toString(), openTarget, 'noopener,noreferrer');
	}

	// Eventi apertura
	document.addEventListener('click', function(e){
	  var t = e.target;

	  // open calendar
	  var openBtn = t.closest ? t.closest('[data-bnbw-open]') : null;
	  if(openBtn && root.contains(openBtn)){
		var which = openBtn.getAttribute('data-bnbw-open');
		if(which === 'calendar'){
		  state.selecting = openBtn.getAttribute('data-bnbw-date-part') || 'in';
		  openPop('calendar');
		  return;
		}
		if(which === 'guests'){
		  openPop('guests');
		  return;
		}
	  }

	  // close
	  if(t.closest && t.closest('[data-bnbw-close]') && popCalendar.contains(t)){
		closeAll();
		return;
	  }

	  // overlay click
	  if(t === overlay){
		closeAll();
		return;
	  }

	  // reset
	  if(t.closest && t.closest('[data-bnbw-reset]') && root.contains(t)){
		resetAll();
		return;
	  }

	  // submit
	  if(t.closest && t.closest('[data-bnbw-submit]') && root.contains(t)){
		buildAndOpenUrl();
		return;
	  }

	  // guests +/- and apply
	  var inc = t.closest && t.closest('[data-bnbw-inc]');
	  var dec = t.closest && t.closest('[data-bnbw-dec]');
	  if(inc && (root.contains(inc) || popGuests.contains(inc))){
		var k1 = inc.getAttribute('data-bnbw-inc');
		state[k1] = clamp(k1, state[k1] + 1);
		renderGuests();
		return;
	  }
	  if(dec && (root.contains(dec) || popGuests.contains(dec))){
		var k2 = dec.getAttribute('data-bnbw-dec');
		if(state[k2] <= LIMITS[k2].min) return;
		state[k2] = clamp(k2, state[k2] - 1);
		renderGuests();
		return;
	  }

	  if(t.closest && t.closest('[data-bnbw-apply]') && popGuests.contains(t)){
		closeAll();
		return;
	  }
	});

	// pets change
	petsEl.addEventListener('change', function(){
	  state.pets = parseInt(petsEl.value, 10) || 0;
	  renderTopDates();
	});

	childAgesGridEl.addEventListener('change', function(e){
	  var t = e.target;
	  if(!t || !t.matches || !t.matches('[data-bnbw-child-age]')) return;
	  var idx = parseInt(t.getAttribute('data-bnbw-child-age'), 10);
	  if(isNaN(idx)) return;
	  state.childAges[idx] = parseInt(t.value, 10) || 0;
	});

	// calendar nav
	popCalendar.querySelector('[data-bnbw-cal-prev]').addEventListener('click', function(){
	  state.baseMonth = new Date(state.baseMonth.getFullYear(), state.baseMonth.getMonth()-1, 1);
	  renderCalendar();
	});
	popCalendar.querySelector('[data-bnbw-cal-next]').addEventListener('click', function(){
	  state.baseMonth = new Date(state.baseMonth.getFullYear(), state.baseMonth.getMonth()+1, 1);
	  renderCalendar();
	});

	// ESC close
	document.addEventListener('keydown', function(e){
	  if(e.key === 'Escape' && state.open){
		closeAll();
	  }
	});

	// Click fuori dal widget (desktop) -> chiudi
	// Usa la cattura: renderCalendar può rimuovere la cella cliccata prima del bubbling.
	document.addEventListener('click', function(e){
	  if(!state.open) return;
	  var insideWidget = root.contains(e.target);
	  var insideCalendar = popCalendar.contains(e.target);
	  var insideGuests = popGuests.contains(e.target);
	  var onOverlay = (e.target === overlay);
	  if(!insideWidget && !insideCalendar && !insideGuests && !onOverlay){
		closeAll();
	  }
	}, true);

	window.addEventListener('resize', updateViewportHeightVar);
	window.addEventListener('pagehide', function(){ setBodyScrollLocked(false); });
	window.addEventListener('orientationchange', updateViewportHeightVar);
	if(window.visualViewport){
	  window.visualViewport.addEventListener('resize', updateViewportHeightVar);
	  window.visualViewport.addEventListener('scroll', updateViewportHeightVar);
	}

    // I plugin WordPress aggiornano normalmente <html lang> quando cambia lingua.
    var languageObserver = new MutationObserver(refreshLanguage);
    languageObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    window.addEventListener('popstate', refreshLanguage);
    window.addEventListener('hashchange', refreshLanguage);
    window.addEventListener('languagechange', refreshLanguage);

	// Init
	updateViewportHeightVar();
    refreshLanguage();
  }

  function boot(){
	var nodes = document.querySelectorAll('[data-bnbw-multilang]');
	for(var i=0;i<nodes.length;i++){
	  initWidget(nodes[i]);
	}
  }

  if(document.readyState === 'loading'){
	document.addEventListener('DOMContentLoaded', boot);
  } else {
	boot();
  }

})();
</script>
